<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مِسك | بخور وعطور</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f4ef;
    color:#2b211c;
}

header{
    background:#fff;
    padding:20px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.cart{
    background:#2b211c;
    color:white;
    padding:10px 18px;
    border-radius:25px;
}

.hero{
    text-align:center;
    padding:80px 20px;
    background:#e8dccd;
}

.hero h1{
    font-size:45px;
    margin:0 0 15px;
}

.hero p{
    font-size:18px;
}

.button{
    display:inline-block;
    margin-top:20px;
    background:#2b211c;
    color:white;
    padding:14px 28px;
    border-radius:30px;
    text-decoration:none;
}

section{
    padding:45px 7%;
}

h2{
    text-align:center;
    margin-bottom:30px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.product{
    background:white;
    padding:15px;
    border-radius:18px;
    text-align:center;
}

.product-img{
    height:220px;
    background:#ded0bf;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:60px;
}

.product h3{
    margin-bottom:8px;
}

.price{
    color:#80604b;
    font-weight:bold;
}

.add{
    margin-top:12px;
    width:100%;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#2b211c;
    color:white;
}

footer{
    text-align:center;
    padding:30px;
    background:#fff;
}

</style>
</head>

<body>

<header>

<div class="logo">مِسك</div>

<div class="cart">
السلة 🛒 <span id="count">0</span>
</div>

</header>


<div class="hero">

<h1>عبقٌ يبقى</h1>

<p>
بخور وعطور مختارة بعناية لتترك أثرًا لا يُنسى
</p>

<a href="#products" class="button">
تسوقي الآن
</a>

</div>


<section id="products">

<h2>منتجاتنا</h2>

<div class="products">


<div class="product">

<div class="product-img">🪵</div>

<h3>بخور مِسك</h3>

<p class="price">85 ريال</p>

<button class="add" onclick="addToCart()">
أضيفي للسلة
</button>

</div>


<div class="product">

<div class="product-img">🌹</div>

<h3>عطر ورد</h3>

<p class="price">120 ريال</p>

<button class="add" onclick="addToCart()">
أضيفي للسلة
</button>

</div>


<div class="product">

<div class="product-img">✨</div>

<h3>عطر شرقي</h3>

<p class="price">145 ريال</p>

<button class="add" onclick="addToCart()">
أضيفي للسلة
</button>

</div>


</div>

</section>


<footer>

© 2026 مِسك — جميع الحقوق محفوظة

</footer>


<script>

let count = 0;

function addToCart(){

count++;

document.getElementById("count").innerText = count;

}

</script>

</body>
</html>
