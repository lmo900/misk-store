<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مِسك | بخور وعطور</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f8f3ec;
      color: #3d2b1f;
    }

    header {
      background: #3d2b1f;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    .cart-button {
      background: #d8b48a;
      color: #3d2b1f;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 70px 20px;
      background: #eadbc8;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
    }

    .products {
      padding: 40px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .products h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .product-image {
      height: 180px;
      background: #eee2d2;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      margin-bottom: 15px;
    }

    .product h3 {
      margin-bottom: 10px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 15px;
    }

    .add-button {
      background: #3d2b1f;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 20px;
      cursor: pointer;
    }

    .add-button:hover {
      opacity: 0.85;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #3d2b1f;
      color: white;
      margin-top: 40px;
    }

    /* نافذة السلة */

    .cart-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .cart-window {
      background: white;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 20px;
      padding: 25px;
      position: relative;
    }

    .close-cart {
      position: absolute;
      left: 18px;
      top: 15px;
      border: none;
      background: none;
      font-size: 25px;
      cursor: pointer;
    }

    .cart-window h2 {
      margin-bottom: 25px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 15px 0;
      gap: 10px;
    }

    .quantity-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity-buttons button {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: #eadbc8;
      cursor: pointer;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 25px;
      text-align: center;
    }

    .empty-cart {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">مِسك</div>

    <button class="cart-button" onclick="openCart()">
      🛒 السلة (<span id="cart-count">0</span>)
    </button>
  </header>

  <section class="hero">
    <h1>عبقٌ يبقى</h1>
    <p>بخور وعطور مختارة بعناية لتترك أثرًا لا يُنسى</p>
  </section>

  <section class="products">

    <h2>منتجاتنا</h2>

    <div class="product-grid">

      <div class="product">
        <div class="product-image">🪵</div>
        <h3>بخور مِسك</h3>
        <div class="price">85 ريال</div>
        <button class="add-button" onclick="addToCart('بخور مِسك', 85)">
          أضيفي للسلة
        </button>
      </div>

      <div class="product">
        <div class="product-image">🌹</div>
        <h3>عطر ورد</h3>
        <div class="price">120 ريال</div>
        <button class="add-button" onclick="addToCart('عطر ورد', 120)">
          أضيفي للسلة
        </button>
      </div>

      <div class="product">
        <div class="product-image">✨</div>
        <h3>عطر شرقي</h3>
        <div class="price">145 ريال</div>
        <button class="add-button" onclick="addToCart('عطر شرقي', 145)">
          أضيفي للسلة
        </button>
      </div>

    </div>

  </section>

  <!-- نافذة السلة -->

  <div class="cart-overlay" id="cart-overlay" onclick="closeCartOutside(event)">

    <div class="cart-window">

      <button class="close-cart" onclick="closeCart()">×</button>

      <h2>🛒 سلة المشتريات</h2>

      <div id="cart-items"></div>

      <div class="total">
        المجموع: <span id="cart-total">0</span> ريال
      </div>

    </div>

  </div>

  <footer>
    © 2026 مِسك — جميع الحقوق محفوظة
  </footer>

  <script>

    let cart = [];

    function addToCart(name, price) {

      const existingProduct = cart.find(item => item.name === name);

      if (existingProduct) {
        existingProduct.quantity++;
      } else {
        cart.push({
          name: name,
          price: price,
          quantity: 1
        });
      }

      updateCart();

      alert("تمت إضافة المنتج إلى السلة 🤎");
    }

    function updateCart() {

      let count = 0;
      let total = 0;

      cart.forEach(item => {
        count += item.quantity;
        total += item.price * item.quantity;
      });

      document.getElementById("cart-count").textContent = count;
      document.getElementById("cart-total").textContent = total;

      const cartItems = document.getElementById("cart-items");

      if (cart.length === 0) {

        cartItems.innerHTML = `
          <div class="empty-cart">
            السلة فارغة 🛒
          </div>
        `;

        return;
      }

      cartItems.innerHTML = "";

      cart.forEach((item, index) => {

        cartItems.innerHTML += `

          <div class="cart-item">

            <div>
              <strong>${item.name}</strong>
              <br>
              ${item.price} ريال
            </div>

            <div class="quantity-buttons">

              <button onclick="changeQuantity(${index}, 1)">
                +
              </button>

              <span>${item.quantity}</span>

              <button onclick="changeQuantity(${index}, -1)">
                −
              </button>

            </div>

          </div>

        `;
      });
    }

    function changeQuantity(index, amount) {

      cart[index].quantity += amount;

      if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
      }

      updateCart();
    }

    function openCart() {

      updateCart();

      document.getElementById("cart-overlay").style.display = "flex";
    }

    function closeCart() {

      document.getElementById("cart-overlay").style.display = "none";
    }

    function closeCartOutside(event) {

      if (event.target.id === "cart-overlay") {
        closeCart();
      }
    }

    updateCart();

  </script>

</body>
</html>
